apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    template: simple-api
  name: simple-api
spec:
  selector:
    matchLabels:
      app: simple-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app: simple-api
      name: simple-api
    spec:
      containers:
      - env:
        - name: TZ
          value: Europe/Prague
        image: registry.vxland.syscallx86.com/simple-api:v1.0.0
        imagePullPolicy: Always
        name: simple-api
        resources:
          limits:
            cpu: 100m
            memory: 200M
          requests:
            cpu: 100m
            memory: 200M
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/simeple/config.yaml
          name: config
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: config.yaml
            path: config.yaml
          name: simple-api-config
        name: config
